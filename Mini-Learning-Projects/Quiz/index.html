<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="quiz-container">
      <div class="quiz-header">
        <h1>JavaScript Quiz</h1>
        <p id="progress">Question 1 of 10</p>
        <p id="timer">Time: 10</p>
      </div>
      <div id="quiz-box">
        <h2 id="question">Question goes here</h2>
        <div id="answer-buttons">
          <button class="answer-btn">Answer 1</button>
          <button class="answer-btn">Answer 2</button>
          <button class="answer-btn">Answer 3</button>
          <button class="answer-btn">Answer 4</button>
        </div>
        <button id="next-btn">Next</button>
      </div>
      <div id="result-box" class="hide">
        <h2>Quiz Completed!</h2>
        <p id="score">Your score: 0/10</p>
        <p id="best-score">Best score: 0/10</p>
        <button id="restart-btn">Restart Quiz</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
